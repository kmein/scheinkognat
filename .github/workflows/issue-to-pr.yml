name: issue → pr

on:
  issues:
    types: [opened, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: issue-to-pr-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  submission-to-pr:
    # Der `labels`-Query-Param des Web-Formulars greift nur bei Nutzern mit
    # Schreibrechten. Einreichungen erkennen wir deshalb zusätzlich am Marker,
    # den SubmitForm.tsx in den Body schreibt.
    if: |
      (github.event.action == 'labeled' && github.event.label.name == 'einreichung')
      || (github.event.action == 'opened' && (
            contains(github.event.issue.labels.*.name, 'einreichung')
            || contains(github.event.issue.body, '<!-- scheinkognat:einreichung -->')
         ))
    runs-on: ubuntu-latest
    steps:
      - name: Label setzen
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --add-label einreichung

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Issue → PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
          ISSUE_CREATED_AT: ${{ github.event.issue.created_at }}
        run: pnpm exec tsx scripts/issue-to-pr.ts
